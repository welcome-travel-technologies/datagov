name: DataGov checks and Azure release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datagov-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DEBUG: "True"
      PYTHON_DOTENV_DISABLED: "1"
      DATAGOV_DATABASE_TARGET: local
      DB_HOST: 127.0.0.1
      DB_NAME: catalog
      DB_USER: catalog
      DB_PASSWORD: ci-disposable
      DB_SSLMODE: disable
      SECRET_KEY: disposable-ci-key-no-production-access
      GEMINI_API_KEY: disposable-ci-key-no-provider-calls
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/app/requirements.txt
      - run: pip install -r backend/app/requirements.txt
      - run: python -m unittest discover -s deploy/azure/tests -v
      - run: python deploy/azure/check_compose.py
      # nginx.conf in the gateway's nginx: private routes 404 in every spelling, the rest proxies.
      - run: python deploy/azure/check_gateway.py
      - working-directory: backend/app
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  release:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # No environment reviewer gate: a successful main build deploys automatically.
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify and log into registry
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACR_NAME"
          actual=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          test "$actual" = "$ACR_LOGIN_SERVER"
          az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/datagov-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=datagov-backend
          cache-to: type=gha,mode=max,scope=datagov-backend
      - id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/datagov-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=datagov-frontend
          cache-to: type=gha,mode=max,scope=datagov-frontend
      - id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/azure/Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/datagov-gateway:sha-${{ github.sha }}
      # Optional Document Analyzer image (docs/document-analyzer.md): built only while the
      # repository variable ANALYZER_IMAGE_ENABLED is true, FROM the luccy image pinned in LUCCY_IMAGE.
      # It never fails a DataGov release: when the check or the build fails, the release goes
      # on without an analyzer image and the VM keeps the analyzer image it already runs.
      - id: luccy-base
        name: Check the luccy base image
        if: vars.ANALYZER_IMAGE_ENABLED == 'true'
        continue-on-error: true
        shell: bash
        env:
          LUCCY_IMAGE: ${{ vars.LUCCY_IMAGE }}
        run: |
          set -euo pipefail
          case "$LUCCY_IMAGE" in
            "$ACR_LOGIN_SERVER"/*) ;;
            *) echo "::warning::LUCCY_IMAGE must be imported into $ACR_LOGIN_SERVER (az acr import)"; exit 1 ;;
          esac
          [[ "$LUCCY_IMAGE" =~ ^[a-z0-9.-]+/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || { echo "::warning::LUCCY_IMAGE must be pinned by digest"; exit 1; }
      - id: analyzer
        if: vars.ANALYZER_IMAGE_ENABLED == 'true' && steps.luccy-base.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: analyzer
          platforms: linux/amd64
          push: true
          build-args: LUCCY_IMAGE=${{ vars.LUCCY_IMAGE }}
          tags: ${{ vars.ACR_LOGIN_SERVER }}/datagov-document-analyzer:sha-${{ github.sha }}
          cache-from: type=gha,scope=datagov-document-analyzer
          cache-to: type=gha,mode=max,scope=datagov-document-analyzer
      - name: Report a skipped analyzer image
        if: vars.ANALYZER_IMAGE_ENABLED == 'true' && steps.analyzer.outcome != 'success'
        shell: bash
        run: echo "::warning::The Document Analyzer image was not built (see the steps above); this release keeps the analyzer image the VM already runs."
      - name: Deploy and verify VM release
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          # Empty when the analyzer was not built: the release then carries no analyzer image
          # and deploy.py keeps the previous one (next_state merges the images).
          ANALYZER_DIGEST: ${{ steps.analyzer.outputs.digest }}
        run: python3 deploy/azure/release.py --component app
