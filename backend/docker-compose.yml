# Cap container stdout logs — the ETL worker prints thousands of lines per
# workflow run and docker's default json-file driver never rotates, slowly
# filling the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  web:
    build: .
    expose:
      - 8000
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    restart: always
    logging: *default-logging

  worker:
    build: .
    command: python manage.py qcluster
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    restart: always
    logging: *default-logging

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
    depends_on:
      - web
    restart: always
    logging: *default-logging

volumes:
  static_volume:
